name: IFCCore CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: dotnet restore SpatialViewer.IFCCore.sln
      - run: dotnet build SpatialViewer.IFCCore.sln -c Debug --no-restore
      - run: dotnet build SpatialViewer.IFCCore.sln -c Release --no-restore
      - run: dotnet test SpatialViewer.IFCCore.sln -c Release --no-build --verbosity normal
